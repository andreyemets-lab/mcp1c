# Реверс-проксі nginx для MCP-сервера 1С (ТЗ, п. 6.5, 11.2).
#
# Публічна адреса:  https://mcp.company.ua/mcp
# Публікація 1С:    http://onec-web.local/erp-mcp/hs/mcp1c  (лише HTTP-сервіс mcp1c_Сервер, див. ../1c/default.vrd)
#
# Що робить проксі:
#  - TLS 1.2+ і HSTS; HTTP між проксі і веб-сервером 1С - лише в довіреній мережі;
#  - обмеження розміру тіла (256 КБ, як maxBodyBytes у налаштуваннях сервера) і частоти запитів з IP;
#  - передає IP клієнта в X-Real-IP (у налаштуваннях сервера clientIpHeader = "X-Real-IP");
#  - відкидає токени в рядку запиту (параметр AccessToken платформи);
#  - переносить Authorization: Bearer у X-MCP-Authorization: веб-розширення 1С сприймає Authorization
#    як облікові дані 1С навіть з користувачем у рядку з'єднання публікації і відповідає 401 ще до коду
#    сервісу (модель B, перевірено на 8.3.27 з IIS 10);
#  - не пише заголовки і рядок запиту в журнал доступу.
#
# Підключення: скопіюйте файл у /etc/nginx/conf.d/, замініть імена, сертифікати й адресу upstream,
# перевірте конфігурацію (nginx -t) і перезавантажте nginx (nginx -s reload).

# --- у контексті http (файли з conf.d підключаються саме туди) ---------------

limit_req_zone $binary_remote_addr zone=mcp1c_ip:10m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=mcp1c_conn:10m;

# Журнал без заголовків і рядка запиту: токени й параметри не потрапляють на диск.
log_format mcp1c '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';

upstream mcp1c_onec {
    server onec-web.local:80;        # веб-сервер з публікацією 1С (Apache або IIS)
    keepalive 16;
}

server {
    listen 80;
    server_name mcp.company.ua;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;                        # nginx 1.25.1+; для старіших версій - "listen 443 ssl http2;"
    server_name mcp.company.ua;

    ssl_certificate     /etc/ssl/mcp.company.ua/fullchain.pem;
    ssl_certificate_key /etc/ssl/mcp.company.ua/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:mcp1c_tls:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    access_log /var/log/nginx/mcp1c.log mcp1c;
    client_max_body_size 256k;
    server_tokens off;

    # Токен у рядку запиту заборонено (ТЗ, п. 6.1): платформа приймає JWT у параметрі AccessToken.
    if ($args ~* "(^|&)accesstoken=") {
        return 400;
    }

    location = /mcp {
        limit_req zone=mcp1c_ip burst=20 nodelay;
        limit_req_status 429;
        limit_conn mcp1c_conn 10;

        proxy_pass http://mcp1c_onec/erp-mcp/hs/mcp1c;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        # IP клієнта для обмежень і захисту від перебору: значення завжди перезаписується проксі,
        # тож клієнт не може підробити X-Real-IP.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;

        # Модель B: токен переноситься в окремий заголовок, Authorization до 1С не доходить.
        proxy_set_header X-MCP-Authorization $http_authorization;
        proxy_set_header Authorization "";

        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }

    # Перевірка живості без деталей (GET /mcp/health -> "ok").
    location = /mcp/health {
        proxy_pass http://mcp1c_onec/erp-mcp/hs/mcp1c/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # Етап 3 (OAuth): /.well-known/oauth-* і /oauth/* -> /erp-mcp/hs/mcp1c і /erp-mcp/hs/mcp1c-oauth.

    location / {
        return 404;
    }
}
